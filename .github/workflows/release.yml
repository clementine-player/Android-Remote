# Releases the app every week there's something to tell users, with no manual steps.
#
# Commits that change something users notice carry a "Release-note:" trailer: one line for
# users. Every Monday this collects the notes since the last release (scripts/plan_release.sh);
# with none, it does nothing, so refactoring, tests and CI never make a release. With some, it:
#   - takes the store screenshots: the app on an emulator against a real Clementine
#     (store-screenshots.yml)
#   - makes a release commit on top of master, setting the version, writing the notes as the
#     fastlane changelog and adding the screenshots, and pushes it as the tag v<version>.
#     Nothing is pushed to master, which keeps its -dev version. F-Droid builds the tag.
#   - publishes a GitHub release with every note and the APK, signed with the release key in
#     Cloud KMS
#   - uploads the Play bundle to production (PLAY_RELEASE_TRACK, default production; the
#     testing tracks get every development build), with the notes as its release notes, and
#     sends Play the store listing with the new screenshots (scripts/play_listing.py)
#
# Run it by hand (Actions → release → Run workflow) to release now rather than on Monday, or,
# with a tag, to publish an existing release again after a failure. Run by hand, it releases
# any change since the last release, noting "Fixes and improvements." if none has a note.
#
# As in dev.yml, there are no keys or credentials here: signing goes through Cloud KMS, and
# Google Cloud is reached with Workload Identity Federation. Until each signing certificate is
# committed its part is skipped with a notice, and with neither, nothing is released. See
# RELEASING.md.
name: release
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish this existing release again (such as v13.1), instead of a new one"
        required: false

permissions:
  contents: write # for the tag and the GitHub release
  id-token: write # for the OIDC token Workload Identity Federation exchanges

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/611551928920/locations/global/workloadIdentityPools/github-actions/providers/android-remote-play
  SERVICE_ACCOUNT: android-play-release@clementine-data.iam.gserviceaccount.com
  # Signs the GitHub release's APK; created by scripts/gcp_release_setup.sh.
  RELEASE_KMS_KEY: projects/clementine-data/locations/global/keyRings/android-signing/cryptoKeys/github-release/cryptoKeyVersions/1
  RELEASE_CERT: app/release_cert.pem
  # Play's upload key, as in dev.yml.
  UPLOAD_KMS_KEY: projects/clementine-data/locations/global/keyRings/android-signing/cryptoKeys/play-upload/cryptoKeyVersions/1
  UPLOAD_CERT: app/upload_cert.pem
  # Pinned with its checksum since it signs releases; keep in step with dev.yml.
  KMS_SIGNER_VERSION: 2026.09.25-a3c0e5e
  KMS_SIGNER_SHA256: 843d553610ebca4a4beee8fc9a66c0c9c7575bc614bc69ea3646eb656974798a

jobs:
  # Whether there's a release to make, so the screenshots are only taken for one. The release
  # job plans it again, in full.
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan the release
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          ALWAYS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          # Publishing a release again: it has its screenshots.
          if [ -n "$TAG" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            scripts/plan_release.sh | grep '^release=' | tee -a "$GITHUB_OUTPUT"
          fi

  screenshots:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/store-screenshots.yml
    # What store-screenshots.yml asks for; it only comments on pull requests.
    permissions:
      contents: read
      pull-requests: write

  release:
    needs: [plan, screenshots]
    # Also without screenshots: when they failed, the release keeps the last release's.
    # Workload Identity Federation admits master alone.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    # With dev.yml and play-listing.yml: one Google Play upload at a time.
    concurrency:
      group: play
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # All of master's history and tags: the notes and version come from them.
          fetch-depth: 0

      - name: Plan the release
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          ALWAYS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          notes="$RUNNER_TEMP/notes"
          if [ -z "$TAG" ]; then
            scripts/plan_release.sh "$notes" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # Again: the release commit has the version, the changelog and the notes.
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "::error::There's no tag $TAG."; exit 1; }
          git checkout -q "$TAG"
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          mkdir -p "$notes"
          cp "fastlane/metadata/android/en-US/changelogs/$code.txt" "$notes/changelog.txt"
          git log -1 --format=%b | sed '/^$/d' > "$notes/notes.md"
          {
            echo "release=true"
            echo "again=true"
            echo "name=${TAG#v}"
            echo "code=$code"
            echo "notes=$notes"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        run: echo "::notice::No release notes since ${{ steps.plan.outputs.last }}, so no release."

      - name: Check the signing setup
        id: setup
        if: steps.plan.outputs.release == 'true'
        run: |
          apk=false; play=false
          if [ -f "$RELEASE_CERT" ]; then
            apk=true
          else
            echo "::notice::The GitHub release will have no APK: $RELEASE_CERT is not committed yet (see RELEASING.md)."
          fi
          if [ -f "$UPLOAD_CERT" ]; then
            play=true
          else
            echo "::notice::Not releasing on Google Play: $UPLOAD_CERT is not committed yet (see RELEASING.md)."
          fi
          {
            echo "apk=$apk"
            echo "play=$play"
            echo "cloud=$([ $apk = true ] || [ $play = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          # Nothing is released, not even the tag, until releases can be signed.
          if [ $apk = false ] && [ $play = false ]; then
            echo "::warning::Releases aren't set up yet, so nothing was released (see RELEASING.md)."
          fi

      - name: Download the screenshots
        if: >
          steps.setup.outputs.cloud == 'true' && steps.plan.outputs.again != 'true'
          && needs.screenshots.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/taken

      - uses: actions/setup-python@v7
        if: steps.setup.outputs.cloud == 'true'
        with:
          python-version: "3.13"
      - run: pip install google-api-python-client google-auth pillow
        if: steps.setup.outputs.cloud == 'true'

      # From the last release's, so a screen that looks the same stays the same file, and when
      # the screenshots failed, the release keeps them.
      - name: The store screenshots
        if: steps.setup.outputs.cloud == 'true' && steps.plan.outputs.again != 'true'
        env:
          LAST: ${{ steps.plan.outputs.last }}
          TAKEN: ${{ needs.screenshots.result == 'success' && format('{0}/taken/screenshots', runner.temp) || '' }}
        run: |
          shots=fastlane/metadata/android/en-US/images/phoneScreenshots
          if [ -n "$LAST" ] && git cat-file -e "$LAST:$shots" 2> /dev/null; then
            git checkout "$LAST" -- "$shots"
          fi
          if [ -n "$TAKEN" ]; then
            scripts/store_screenshots.py "$TAKEN"
          else
            echo "::warning::The screenshots weren't taken, so this release keeps ${LAST:-no release}'s."
          fi

      - name: Make the release commit
        if: steps.setup.outputs.cloud == 'true' && steps.plan.outputs.again != 'true'
        env:
          NAME: ${{ steps.plan.outputs.name }}
          CODE: ${{ steps.plan.outputs.code }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          sed -i -e "s/^\( *versionCode = \)[0-9]*$/\1$CODE/" \
            -e "s/^\( *versionName = \)\".*\"$/\1\"$NAME\"/" app/build.gradle.kts
          changelog="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          mkdir -p "$(dirname "$changelog")"
          cp "$NOTES/changelog.txt" "$changelog"
          git add app/build.gradle.kts "$changelog"
          git add -A fastlane/metadata/android/en-US/images
          # Who makes the release commit, and the tag after it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Release $NAME" -m "$(cat "$NOTES/notes.md")"
          git show --stat HEAD

      - uses: actions/setup-java@v5
        if: steps.setup.outputs.cloud == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: steps.setup.outputs.cloud == 'true'

      - name: Build the unsigned APK and bundle
        if: steps.setup.outputs.cloud == 'true'
        run: >
          ./gradlew assembleFdroidRelease bundlePlayRelease
          -PversionCodeOverride=${{ steps.plan.outputs.code }}
          -PversionNameOverride=${{ steps.plan.outputs.name }}

      - name: Get kms-signer
        if: steps.setup.outputs.cloud == 'true'
        run: |
          zip="kms-signer-$KMS_SIGNER_VERSION.zip"
          curl -sSfL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/clementine-player/kms-signer/releases/download/v$KMS_SIGNER_VERSION/$zip"
          echo "$KMS_SIGNER_SHA256  $RUNNER_TEMP/$zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "KMS_SIGNER=$RUNNER_TEMP/kms-signer-$KMS_SIGNER_VERSION/bin/kms-signer" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        if: steps.setup.outputs.cloud == 'true'
        id: auth
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Sign the APK with Cloud KMS
        id: apk
        if: steps.setup.outputs.apk == 'true'
        run: |
          apk="$RUNNER_TEMP/ClementineRemote-${{ steps.plan.outputs.name }}.apk"
          "$KMS_SIGNER" sign --key "$RELEASE_KMS_KEY" --cert "$RELEASE_CERT" \
            --in app/build/outputs/apk/fdroid/release/ClementineRemote-fdroid-release-unsigned.apk \
            --out "$apk"
          "$KMS_SIGNER" verify --in "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Sign the bundle with Cloud KMS
        id: bundle
        if: steps.setup.outputs.play == 'true'
        run: |
          bundle="$RUNNER_TEMP/ClementineRemote-play-release.aab"
          min_sdk=$(sed -n 's/^ *minSdk = \([0-9]*\)/\1/p' app/build.gradle.kts)
          "$KMS_SIGNER" sign --key "$UPLOAD_KMS_KEY" --cert "$UPLOAD_CERT" \
            --in app/build/outputs/bundle/playRelease/ClementineRemote-play-release.aab \
            --out "$bundle" --min-sdk "$min_sdk"
          "$KMS_SIGNER" verify --in "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      # Only once everything is built and signed: a failure before here leaves no trace.
      - name: Push the tag
        if: steps.setup.outputs.cloud == 'true' && steps.plan.outputs.again != 'true'
        run: |
          tag="v${{ steps.plan.outputs.name }}"
          git tag -a "$tag" -m "Clementine Remote ${{ steps.plan.outputs.name }}"
          git push origin "$tag"

      - name: Publish the GitHub release
        if: steps.setup.outputs.cloud == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.plan.outputs.name }}
          NAME: ${{ steps.plan.outputs.name }}
          NOTES: ${{ steps.plan.outputs.notes }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # Already there when publishing again. Releases are immutable once published, so it
          # gets the APK only if it went out without one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ -n "$APK" ] && ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$(basename "$APK")"; then
              gh release upload "$TAG" "$APK" ||
                echo "::warning::Couldn't add the APK to $TAG: an immutable release can't be changed."
            fi
          else
            gh release create "$TAG" --verify-tag --title "Clementine Remote $NAME" \
              --notes-file "$NOTES/notes.md" ${APK:+"$APK"}
          fi

      - name: Release notes for Google Play
        if: steps.setup.outputs.play == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          cp "${{ steps.plan.outputs.notes }}/changelog.txt" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - name: Upload to Google Play
        if: steps.setup.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          # The federated credentials from the auth step, not a service account key.
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: org.clementine_player.remote
          releaseFiles: ${{ steps.bundle.outputs.path }}
          releaseName: ${{ steps.plan.outputs.name }}
          # R8's map of the names it shortened, so Play shows readable stack traces.
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          tracks: ${{ vars.PLAY_RELEASE_TRACK || 'production' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # The listing as released: its text and images, with this release's screenshots.
      - name: Send the store listing to Google Play
        if: steps.setup.outputs.cloud == 'true'
        run: scripts/play_listing.py
