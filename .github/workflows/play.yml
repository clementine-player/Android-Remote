# Publishes every change on master to the Google Play internal testing track, a private
# channel for up to 100 testers. See RELEASING.md for the one-time setup; until the secrets
# are set, this only checks that the Play bundle builds.
name: play
on:
  push:
    branches: [master]
  workflow_dispatch:

# Uploads must land in order, as each needs a higher version code than the last.
concurrency:
  group: play
  cancel-in-progress: false

jobs:
  internal:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code is the number of commits on the branch.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode upload key
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          name="$base+$(git rev-parse --short HEAD)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)"

      - name: Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew bundlePlayRelease
          -PplayVersionCode=${{ steps.version.outputs.code }}
          -PplayVersionName=${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v5
        with:
          name: play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: Release notes
        run: |
          mkdir -p whatsnew
          git log -1 --format=%s | cut -c1-500 > whatsnew/whatsnew-en-US

      - name: Upload to the internal testing track
        if: env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.clementine_player.remote
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: internal
          # "draft" until the app's first release has been rolled out in Play Console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew

      - name: Skipped upload
        if: env.HAS_SIGNING != 'true' || env.HAS_PLAY != 'true'
        run: >
          echo "::notice::Built the Play bundle but did not upload it: the signing or
          Play secrets are not set (see RELEASING.md)."
