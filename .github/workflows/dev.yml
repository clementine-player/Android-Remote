# Publishes every change to the app on master as a development build:
#   - on Google Play's internal testing track, a private channel for up to 100 testers, and
#     its closed testing track, for the testers on its list
#   - as a GitHub pre-release, dev-<version code>, which replaces the last one: the APK, with
#     the same package and signature as releases, so it updates to and from them
# Changes that don't reach the app (tests, docs, CI, store listings) don't make one.
#
# The keys live in Cloud KMS and cannot be exported: the builds are made unsigned and signed by
# clementine-player/kms-signer, which only sends digests to KMS. GitHub Actions authenticates to
# Google Cloud through Workload Identity Federation (the pool Clementine's macOS signing uses,
# with its own provider and service account), for both signing and the Play upload, so the
# repository holds no keys or credentials at all. See RELEASING.md and scripts/gcp_*_setup.sh
# for the one-time setup; until each signing certificate is committed, its part is skipped with
# a notice.
name: dev
on:
  push:
    branches: [master]
    # What goes into the app; later patterns override earlier ones.
    paths:
      - "app/**"
      - "!app/src/test/**"
      - "!app/src/androidTest/**"
      - "!app/lint-baseline.xml"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/dev.yml"
  workflow_dispatch:

# Uploads must land in order, as each needs a higher version code than the last; release.yml
# shares the group.
concurrency:
  group: play
  cancel-in-progress: false

permissions:
  contents: write # for the dev pre-release
  id-token: write # for the OIDC token Workload Identity Federation exchanges

# Created by scripts/gcp_play_setup.sh and scripts/gcp_release_setup.sh.
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/611551928920/locations/global/workloadIdentityPools/github-actions/providers/android-remote-play
  SERVICE_ACCOUNT: android-play-release@clementine-data.iam.gserviceaccount.com
  UPLOAD_KMS_KEY: projects/clementine-data/locations/global/keyRings/android-signing/cryptoKeys/play-upload/cryptoKeyVersions/1
  UPLOAD_CERT: app/upload_cert.pem
  RELEASE_KMS_KEY: projects/clementine-data/locations/global/keyRings/android-signing/cryptoKeys/github-release/cryptoKeyVersions/1
  RELEASE_CERT: app/release_cert.pem
  # The signer release to use, pinned with its checksum since it signs releases. To update, take
  # both from https://github.com/clementine-player/kms-signer/releases (and in release.yml).
  KMS_SIGNER_VERSION: 2026.09.25-a3c0e5e
  KMS_SIGNER_SHA256: 843d553610ebca4a4beee8fc9a66c0c9c7575bc614bc69ea3646eb656974798a

jobs:
  dev:
    # Workload Identity Federation admits master alone.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code comes from the number of commits on the branch.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: version
        run: |
          # Twice the commit count: releases (release.yml) take the odd code after it, so
          # the two never collide and every upload's code is higher than the last.
          code=$(( 2 * $(git rev-list --count HEAD) ))
          name="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)+$(git rev-parse --short HEAD)"
          min_sdk=$(sed -n 's/^ *minSdk = \([0-9]*\)/\1/p' app/build.gradle.kts)
          {
            echo "code=$code"
            echo "name=$name"
            echo "min_sdk=$min_sdk"
          } >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)"

      - name: Build the unsigned bundle and APK
        run: >
          ./gradlew bundlePlayRelease assembleFdroidRelease
          -PversionCodeOverride=${{ steps.version.outputs.code }}
          -PversionNameOverride=${{ steps.version.outputs.name }}

      - name: Check the signing setup
        id: setup
        run: |
          play=false; github=false
          if [ -f "$UPLOAD_CERT" ]; then
            play=true
          else
            echo "::notice::Built the Play bundle but did not sign or upload it: $UPLOAD_CERT is not committed yet (see RELEASING.md)."
          fi
          if [ -f "$RELEASE_CERT" ]; then
            github=true
          else
            echo "::notice::Built the APK but did not sign or publish it: $RELEASE_CERT is not committed yet (see RELEASING.md)."
          fi
          {
            echo "play=$play"
            echo "github=$github"
            echo "cloud=$([ $play = true ] || [ $github = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Get kms-signer
        if: steps.setup.outputs.cloud == 'true'
        run: |
          zip="kms-signer-$KMS_SIGNER_VERSION.zip"
          curl -sSfL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/clementine-player/kms-signer/releases/download/v$KMS_SIGNER_VERSION/$zip"
          echo "$KMS_SIGNER_SHA256  $RUNNER_TEMP/$zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "KMS_SIGNER=$RUNNER_TEMP/kms-signer-$KMS_SIGNER_VERSION/bin/kms-signer" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        id: auth
        if: steps.setup.outputs.cloud == 'true'
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Sign the bundle with Cloud KMS
        if: steps.setup.outputs.play == 'true'
        run: |
          "$KMS_SIGNER" sign --key "$UPLOAD_KMS_KEY" --cert "$UPLOAD_CERT" \
            --in app/build/outputs/bundle/playRelease/ClementineRemote-play-release.aab \
            --out "$RUNNER_TEMP/ClementineRemote-play-release.aab" \
            --min-sdk ${{ steps.version.outputs.min_sdk }}
          "$KMS_SIGNER" verify --in "$RUNNER_TEMP/ClementineRemote-play-release.aab"

      - name: Sign the APK with Cloud KMS
        if: steps.setup.outputs.github == 'true'
        run: |
          "$KMS_SIGNER" sign --key "$RELEASE_KMS_KEY" --cert "$RELEASE_CERT" \
            --in app/build/outputs/apk/fdroid/release/ClementineRemote-fdroid-release-unsigned.apk \
            --out "$RUNNER_TEMP/ClementineRemote-dev.apk"
          "$KMS_SIGNER" verify --in "$RUNNER_TEMP/ClementineRemote-dev.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: dev-builds
          path: |
            ${{ runner.temp }}/ClementineRemote-play-release.aab
            ${{ runner.temp }}/ClementineRemote-dev.apk
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/fdroid/release/*.apk

      - name: Release notes
        run: |
          mkdir -p whatsnew
          git log -1 --format=%s | cut -c1-500 > whatsnew/whatsnew-en-US
          # The GitHub pre-release: the build, then what changed since the last release.
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "Development build ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}), from $GITHUB_SHA."
            echo "It updates to the next release, and the next development build updates it."
            echo
            echo "Changes since ${last:-the start}:"
            echo
            git log --format='- %s' --no-merges ${last:+"$last.."}HEAD | head -n 50
          } > "$RUNNER_TEMP/dev-notes.md"

      - name: Upload to the internal and closed testing tracks
        if: steps.setup.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          # The federated credentials from the auth step, not a service account key.
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: org.clementine_player.remote
          releaseFiles: ${{ runner.temp }}/ClementineRemote-play-release.aab
          releaseName: ${{ steps.version.outputs.name }}
          tracks: internal,alpha
          # "draft" until the app's first release has been rolled out in Play Console.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew

      - name: Publish the dev pre-release
        if: steps.setup.outputs.github == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-${{ steps.version.outputs.code }}
        run: |
          # Releases are immutable once published, and a deleted one's tag can't be used again,
          # so each build is a pre-release of its own. Already there when this is run again.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Development build ${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/dev-notes.md" \
              "$RUNNER_TEMP/ClementineRemote-dev.apk"
          fi
          # Then only the newest stays. An immutable release's tag may have to stay.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName | select(. == "dev" or startswith("dev-"))' |
            while read -r old; do
              [ "$old" != "$TAG" ] || continue
              gh release delete "$old" --yes
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$old" > /dev/null ||
                echo "::notice::Kept the tag $old: GitHub protects an immutable release's tag."
            done
