# Builds the demo Clementine's image: clementine-it with the demo library (real recordings of the
# showcase works, clementine-it/demo-library.tsv) and Clementine's latest release, pushed to
# ghcr.io/clementine-player/clementine-demo. The demo VM (scripts/gcp_demo_setup.sh) pulls the
# newest every night. Rebuilt when clementine-it changes, and weekly for new Clementine releases.
# The package must be made public once, in its settings on GitHub, so the VM can pull it without
# credentials. See RELEASING.md.
name: demo-image
on:
  push:
    branches: [master]
    paths:
      - clementine-it/**
      - .github/workflows/demo-image.yml
  schedule:
    - cron: "37 5 * * 1" # Mondays, 05:37 UTC
  workflow_dispatch:

concurrency:
  group: demo-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE: ghcr.io/clementine-player/clementine-demo

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Download the latest Clementine release
        id: clementine
        run: |
          tag=$(gh release view --repo clementine-player/Clementine --json tagName -q .tagName)
          echo "Clementine $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo clementine-player/Clementine \
            --pattern '*resolute_amd64.deb' --dir clementine-it

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: clementine-it
          build-args: LIBRARY=demo
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.clementine.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=clementine-it-demo
          cache-to: type=gha,scope=clementine-it-demo,mode=max
