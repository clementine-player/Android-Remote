org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The app itself still uses the pre-AndroidX support libraries (migration is a
# later step); AndroidX is only pulled in by test dependencies such as Robolectric.
android.useAndroidX=true
# Keep pre-AGP-8 R class behaviour until the code stops relying on it
# (switch statements over R.id values and library resources via the app's R).
android.nonTransitiveRClass=false
android.nonFinalResIds=false
